<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="c">
      <path d="M16 1.5 L29.5 7 L29.5 18 C29.5 25.5 23.5 30.5 16 32 C8.5 30.5 2.5 25.5 2.5 18 L2.5 7 Z"/>
    </clipPath>
  </defs>
  <style>
    /* Dark mode — near-black shield, warm off-white rings */
    .bg   { fill: #1d1d1b; }
    .edge { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 1; }
    .ro   { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 0.8; }
    .rm   { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 1.2; }
    .tk   { stroke: rgba(255,255,255,0.55); stroke-width: 1.2; stroke-linecap: round; }
    .core { fill: rgba(255,255,255,0.60); }
    .dot  { fill: #ffffff; }
    .sh   { fill: none; stroke: rgba(255,255,255,0.10); stroke-width: 1.8; stroke-linecap: round; }

    /* Light mode — dark charcoal shield (matches sidebar), same warm off-white */
    @media (prefers-color-scheme: light) {
      .bg   { fill: #444441; }
      .edge { stroke: rgba(255,255,255,0.22); }
      .ro   { stroke: rgba(255,255,255,0.28); }
      .rm   { stroke: rgba(255,255,255,0.65); }
      .tk   { stroke: rgba(255,255,255,0.65); }
      .core { fill: rgba(255,255,255,0.70); }
    }
  </style>

  <!-- Shield body -->
  <path class="bg" d="M16 1.5 L29.5 7 L29.5 18 C29.5 25.5 23.5 30.5 16 32 C8.5 30.5 2.5 25.5 2.5 18 L2.5 7 Z"/>

  <!-- Shield edge -->
  <path class="edge" d="M16 1.5 L29.5 7 L29.5 18 C29.5 25.5 23.5 30.5 16 32 C8.5 30.5 2.5 25.5 2.5 18 L2.5 7 Z"/>

  <!-- Outer orbit ring -->
  <circle class="ro" cx="16" cy="18" r="9.5" clip-path="url(#c)"/>

  <!-- Mid ring -->
  <circle class="rm" cx="16" cy="18" r="6.2" clip-path="url(#c)"/>

  <!-- Cardinal ticks -->
  <line class="tk" x1="16" y1="11"   x2="16"   y2="12.8"/>
  <line class="tk" x1="16" y1="23.2" x2="16"   y2="25"/>
  <line class="tk" x1="9"  y1="18"   x2="10.8" y2="18"/>
  <line class="tk" x1="21.2" y1="18" x2="23"   y2="18"/>

  <!-- Core -->
  <circle class="core" cx="16" cy="18" r="3.2"/>

  <!-- Centre dot -->
  <circle class="dot" cx="16" cy="18" r="1.4"/>

  <!-- Top-left sheen -->
  <path class="sh" d="M7 9 C9 5.5 12.5 3 16 2.5"/>
</svg>
