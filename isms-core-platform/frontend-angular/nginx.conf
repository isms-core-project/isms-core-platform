server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed assets aggressively ({n,} quantifiers break nginx parsing)
    location ~* \.[a-f0-9]+\.(js|css|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html — nginx upstream controls freshness
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
}
