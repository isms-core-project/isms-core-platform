name: isms-core-platform

# ============================================================================
# ISMS CORE Platform
#
# Optional profiles:
#   --profile opensearch-single       single-node OpenSearch (lightweight, default)
#   --profile opensearch-cluster      3-node OpenSearch cluster (enterprise)
#   --profile garage                  Garage S3 object store
#   --profile dashboards              OpenSearch Dashboards (OSD)
#   --profile threat-intel            Threat intelligence feeds container
#   --profile mailpit                 Local SMTP testing UI
#   --profile smtp-bridge             Microsoft 365 SMTP relay bridge
#
# OpenSearch modes are mutually exclusive — always pass exactly one.
# To switch modes: docker compose down, then bring up with new profile.
#
# Standard usage:
#   cp .env.example .env && nano .env
#   docker compose build backend frontend connectors feeds smtp-bridge
#   docker compose up -d
#   ./bootstrap.sh   (first boot only)
# ============================================================================

services:

  # ── Core infrastructure (always on) ────────────────────────────────────────

  isms-core-postgres:
    image: postgres:18-alpine
    container_name: isms-core-postgres
    environment:
      TZ: ${TZ:-Europe/Zurich}
      POSTGRES_DB: isms_db
      POSTGRES_USER: isms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schemas/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isms_user -d isms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-redis:
    image: redis:8-alpine
    container_name: isms-core-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── OpenSearch: single-node (--profile opensearch-single) ─────────────────
  # Explicit profile required — prevents both modes running simultaneously.
  # Default workshop command: docker compose --profile opensearch-single up -d

  isms-core-opensearch:
    profiles: [opensearch-single]
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    container_name: isms-core-opensearch
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g} -Dopensearch.allow_insecure_settings=true
      - bootstrap.memory_lock=true
      - logger.org.opensearch.discovery=ERROR
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── OpenSearch: 3-node cluster (--profile opensearch-cluster) ──────────────
  # Pattern: 3 named services, each with its own volume (no Swarm required).
  # Node1 carries the 'isms-core-opensearch' network alias → backend
  # OPENSEARCH_URL=http://isms-core-opensearch:9200 works unchanged.
  # discovery.seed_hosts excludes self (mirrors reference pattern).

  isms-core-opensearch-node1:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    container_name: isms-core-opensearch-node1
    profiles: [opensearch-cluster]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - node.name=isms-core-opensearch-node1
      - cluster.name=isms-core-cluster
      - discovery.seed_hosts=isms-core-opensearch-node2,isms-core-opensearch-node3
      - cluster.initial_master_nodes=isms-core-opensearch-node1,isms-core-opensearch-node2,isms-core-opensearch-node3
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g} -Dopensearch.allow_insecure_settings=true
      - bootstrap.memory_lock=true
      - logger.org.opensearch.discovery=ERROR
    volumes:
      - osdata01:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
    restart: unless-stopped
    networks:
      isms-core-network:
        aliases:
          - isms-core-opensearch  # same alias as single-node — URL unchanged

  isms-core-opensearch-node2:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    container_name: isms-core-opensearch-node2
    profiles: [opensearch-cluster]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - node.name=isms-core-opensearch-node2
      - cluster.name=isms-core-cluster
      - discovery.seed_hosts=isms-core-opensearch-node1,isms-core-opensearch-node3
      - cluster.initial_master_nodes=isms-core-opensearch-node1,isms-core-opensearch-node2,isms-core-opensearch-node3
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g} -Dopensearch.allow_insecure_settings=true
      - bootstrap.memory_lock=true
      - logger.org.opensearch.discovery=ERROR
    volumes:
      - osdata02:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-opensearch-node3:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    container_name: isms-core-opensearch-node3
    profiles: [opensearch-cluster]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - node.name=isms-core-opensearch-node3
      - cluster.name=isms-core-cluster
      - discovery.seed_hosts=isms-core-opensearch-node1,isms-core-opensearch-node2
      - cluster.initial_master_nodes=isms-core-opensearch-node1,isms-core-opensearch-node2,isms-core-opensearch-node3
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g} -Dopensearch.allow_insecure_settings=true
      - bootstrap.memory_lock=true
      - logger.org.opensearch.discovery=ERROR
    volumes:
      - osdata03:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── OpenSearch setup — ISM policies + index templates ─────────────────────
  # Runs once after OpenSearch is healthy, before the backend starts.
  # Idempotent — safe to re-run. Detects single-node vs cluster automatically
  # and sets number_of_replicas accordingly (0 or 1).

  isms-core-opensearch-setup:
    image: python:3.12-alpine
    container_name: isms-core-opensearch-setup
    entrypoint: ["python3", "/app/setup.py"]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT:-http://isms-core-garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
      - GARAGE_BUCKET_SNAPSHOTS=${GARAGE_BUCKET_SNAPSHOTS:-isms-snapshots}
    volumes:
      - ./opensearch:/app:ro
    depends_on:
      isms-core-opensearch:
        condition: service_healthy
        required: false
      isms-core-opensearch-node1:
        condition: service_healthy
        required: false
    restart: "no"
    networks:
      - isms-core-network

  # ── Garage S3 object store (--profile garage) ───────────────────────────────
  # Apache 2.0, S3-compatible. Replaces MinIO (Community Edition archived).
  # Single-node mode (replication_factor=1 in garage.toml).
  # Buckets: isms-evidence | isms-snapshots | isms-exports
  # S3 API:   http://isms-core-garage:3900
  # Admin API: http://isms-core-garage:3903  (token: see garage/garage.toml)
  #
  # isms-core-garage-setup runs once on first start: assigns layout, creates
  # buckets, imports access key. Idempotent — skipped if already configured.
  # Admin token in garage.toml must match GARAGE_ADMIN_TOKEN in .env.
  #
  # Garage image is scratch-based (no shell) — healthcheck not possible.
  # Setup container polls admin API internally until Garage is ready.

  isms-core-garage:
    image: dxflrs/garage:v1.0.1
    container_name: isms-core-garage
    profiles: [garage]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    ports:
      - "${GARAGE_BIND:-127.0.0.1}:3900:3900"   # S3 API — set GARAGE_BIND=0.0.0.0 to expose
      - "127.0.0.1:3903:3903"                    # Admin API — never expose externally
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-garage-setup:
    image: python:3.12-alpine
    container_name: isms-core-garage-setup
    profiles: [garage]
    entrypoint: ["python3", "/scripts/setup.py"]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - GARAGE_ADMIN_URL=http://isms-core-garage:3903
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-isms-core-garage-admin}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
    volumes:
      - ./garage/setup.py:/scripts/setup.py:ro
    depends_on:
      - isms-core-garage
    restart: "no"
    networks:
      - isms-core-network

  # ── OpenSearch Dashboards (--profile dashboards) ───────────────────────────
  # Open-source Kibana fork by AWS. Apache 2.0.
  # Works with both single-node and cluster — connects via isms-core-opensearch alias.
  # Access: http://<HOST_IP>:5601
  # To enable the Security plugin: set OPENSEARCH_DISABLE_SECURITY=false + OPENSEARCH_USERNAME/PASSWORD.

  isms-core-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: isms-core-dashboards
    profiles: [dashboards]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - 'OPENSEARCH_HOSTS=["http://isms-core-opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - SERVER_BASEPATH=
      - SERVER_REWRITEBASEPATH=false
    ports:
      - "${DASHBOARDS_BIND:-127.0.0.1}:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    depends_on:
      isms-core-opensearch:
        condition: service_healthy
        required: false
      isms-core-opensearch-node1:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-dashboards-setup:
    image: python:3.12-alpine
    container_name: isms-core-dashboards-setup
    profiles: [dashboards]
    entrypoint: ["python3", "/scripts/setup.py"]
    volumes:
      - ./dashboards:/scripts:ro
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DASHBOARDS_URL=http://isms-core-dashboards:5601
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
    depends_on:
      isms-core-dashboards:
        condition: service_healthy
    restart: "no"
    networks:
      - isms-core-network

  # ── Application services ─────────────────────────────────────────────────────

  isms-core-backend:
    build:
      context: ./backend
    image: isms-core-backend:latest
    container_name: isms-core-backend
    volumes:
      - ./datasets/data:/app/datasets:ro
      - ${FRAMEWORK_HOST_PATH:-../isms-core-framework}:/app/isms-framework:ro
      - ${OPERATIONAL_HOST_PATH:-../isms-core-operational}:/app/isms-operational:ro
      - ${PRIVACY_HOST_PATH:-../isms-core-privacy}:/app/isms-privacy:ro
      - ${CLOUD_HOST_PATH:-../isms-core-cloud}:/app/isms-cloud:ro
      - ${AI_HOST_PATH:-../isms-core-ai}:/app/isms-ai:ro
      - ${SEC_HOST_PATH:-../isms-core-sec}:/app/isms-sec:ro
      - ${EXT_HOST_PATH:-../isms-core-ext}:/app/isms-ext:ro
      - ti-data:/data/ti:ro   # GeoLite2 MMDB files (downloaded by threat-intel container)
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATABASE_URL=postgresql://isms_user:${POSTGRES_PASSWORD}@isms-core-postgres:5432/isms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@isms-core-redis:6379/0
      - DATASETS_PATH=/app/datasets
      - FRAMEWORK_PATH=/app/isms-framework
      - OPERATIONAL_PATH=/app/isms-operational
      - PRIVACY_PATH=/app/isms-privacy
      - CLOUD_PATH=/app/isms-cloud
      - AI_PATH=/app/isms-ai
      - SEC_PATH=/app/isms-sec
      - EXT_PATH=/app/isms-ext
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - LOG_LEVEL=INFO
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@isms-core.dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NIST_API_KEY=${NIST_API_KEY:-}
      - CONNECTORS_WORKER_SECRET=${CONNECTORS_WORKER_SECRET:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - PLATFORM_URL=${PLATFORM_URL}
      # Garage S3 object storage (leave empty to use default local Postgres storage)
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT:-http://isms-core-garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
      - GARAGE_BUCKET_EVIDENCE=${GARAGE_BUCKET_EVIDENCE:-isms-evidence}
      - GARAGE_BUCKET_SNAPSHOTS=${GARAGE_BUCKET_SNAPSHOTS:-isms-snapshots}
      - GARAGE_BUCKET_EXPORTS=${GARAGE_BUCKET_EXPORTS:-isms-exports}
      # Storage backend: postgres (default) or opensearch
      - EVIDENCE_STORE=${EVIDENCE_STORE:-postgres}
      # Threat intelligence module — set true when using --profile threat-intel
      - THREAT_INTEL_ENABLED=${THREAT_INTEL_ENABLED:-false}
      # Enrichment API keys for IP Enrichment page
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - IPINFO_API_KEY=${IPINFO_API_KEY:-}
    depends_on:
      isms-core-postgres:
        condition: service_healthy
      isms-core-redis:
        condition: service_healthy
      isms-core-opensearch-setup:
        condition: service_completed_successfully
      # required: false — dependency ignored if the service's profile is not active
      isms-core-opensearch:
        condition: service_healthy
        required: false
      isms-core-opensearch-node1:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 150s
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-beat:
    build:
      context: ./backend
    image: isms-core-beat:latest
    container_name: isms-core-beat
    command: celery -A src.worker.celery_app beat --loglevel=info
    volumes:
      - ./datasets/data:/app/datasets:ro
      - ${FRAMEWORK_HOST_PATH:-../isms-core-framework}:/app/isms-framework:ro
      - ${OPERATIONAL_HOST_PATH:-../isms-core-operational}:/app/isms-operational:ro
      - ${PRIVACY_HOST_PATH:-../isms-core-privacy}:/app/isms-privacy:ro
      - ${CLOUD_HOST_PATH:-../isms-core-cloud}:/app/isms-cloud:ro
      - ${AI_HOST_PATH:-../isms-core-ai}:/app/isms-ai:ro
      - ${SEC_HOST_PATH:-../isms-core-sec}:/app/isms-sec:ro
      - ${EXT_HOST_PATH:-../isms-core-ext}:/app/isms-ext:ro
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATABASE_URL=postgresql://isms_user:${POSTGRES_PASSWORD}@isms-core-postgres:5432/isms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@isms-core-redis:6379/0
      - DATASETS_PATH=/app/datasets
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - PLATFORM_URL=${PLATFORM_URL}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT:-http://isms-core-garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
    healthcheck:
      disable: true
    depends_on:
      isms-core-postgres:
        condition: service_healthy
      isms-core-redis:
        condition: service_healthy
      isms-core-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-worker:
    build:
      context: ./backend
    image: isms-core-worker:latest
    container_name: isms-core-worker
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=isms
    volumes:
      - ./datasets/data:/app/datasets:ro
      - ${FRAMEWORK_HOST_PATH:-../isms-core-framework}:/app/isms-framework:ro
      - ${OPERATIONAL_HOST_PATH:-../isms-core-operational}:/app/isms-operational:ro
      - ${PRIVACY_HOST_PATH:-../isms-core-privacy}:/app/isms-privacy:ro
      - ${CLOUD_HOST_PATH:-../isms-core-cloud}:/app/isms-cloud:ro
      - ${AI_HOST_PATH:-../isms-core-ai}:/app/isms-ai:ro
      - ${SEC_HOST_PATH:-../isms-core-sec}:/app/isms-sec:ro
      - ${EXT_HOST_PATH:-../isms-core-ext}:/app/isms-ext:ro
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATABASE_URL=postgresql://isms_user:${POSTGRES_PASSWORD}@isms-core-postgres:5432/isms_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@isms-core-redis:6379/0
      - DATASETS_PATH=/app/datasets
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - PLATFORM_URL=${PLATFORM_URL}
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT:-http://isms-core-garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
    depends_on:
      isms-core-postgres:
        condition: service_healthy
      isms-core-redis:
        condition: service_healthy
      isms-core-opensearch:
        condition: service_healthy
        required: false
      isms-core-opensearch-node1:
        condition: service_healthy
        required: false
      isms-core-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-frontend:
    build:
      context: ./frontend
      args:
        VITE_SECRET_THEME: ${VITE_SECRET_THEME:-}
    image: isms-core-frontend:latest
    container_name: isms-core-frontend
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - VITE_BACKEND_URL=https://${HOST_IP}
    depends_on:
      isms-core-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── nginx reverse proxy + TLS (A.8.24) ────────────────────────────────────

  isms-core-nginx:
    build:
      context: ./nginx
    image: isms-core-nginx:latest
    container_name: isms-core-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - NGINX_HOST=${FQDN:-${HOST_IP}}
      - FQDN=${FQDN:-}
    depends_on:
      isms-core-backend:
        condition: service_healthy
      isms-core-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── Connectors runner ──────────────────────────────────────────────────────

  isms-core-connectors:
    build:
      context: ./connectors
    image: isms-core-connectors:latest
    container_name: isms-core-connectors
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - ISMS_API_URL=http://isms-core-backend:8000
      - CONNECTORS_WORKER_SECRET=${CONNECTORS_WORKER_SECRET}
      - RUNNER_REFRESH_INTERVAL=${RUNNER_REFRESH_INTERVAL:-60}
      - POLL_INTERVAL=${POLL_INTERVAL:-86400}
    depends_on:
      isms-core-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── Threat Intelligence & Vulnerability Feeds ──────────────────────────────

  isms-core-feeds:
    build:
      context: ./feeds
    image: isms-core-feeds:latest
    container_name: isms-core-feeds
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATABASE_URL=postgresql://isms_user:${POSTGRES_PASSWORD}@isms-core-postgres:5432/isms_db
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - FEEDS_RUN_ON_START=${FEEDS_RUN_ON_START:-true}
      - FEEDS_MITRE_ENABLED=${FEEDS_MITRE_ENABLED:-true}
      - FEEDS_ATLAS_ENABLED=${FEEDS_ATLAS_ENABLED:-true}
      - FEEDS_KEV_ENABLED=${FEEDS_KEV_ENABLED:-true}
      - FEEDS_EPSS_ENABLED=${FEEDS_EPSS_ENABLED:-true}
      - FEEDS_CVE_ENABLED=${FEEDS_CVE_ENABLED:-false}
      - FEEDS_CPE_FULL=${FEEDS_CPE_FULL:-false}
      - FEEDS_EXPLOITDB_ENABLED=${FEEDS_EXPLOITDB_ENABLED:-true}
      - NIST_API_KEY=${NIST_API_KEY:-}
      - ISMS_API_URL=http://isms-core-backend:8000
      - CONNECTORS_WORKER_SECRET=${CONNECTORS_WORKER_SECRET}
    depends_on:
      isms-core-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── Threat Intelligence (optional profile) ────────────────────────────────

  isms-core-threat-intel:
    build:
      context: ./threat-intel
    image: isms-core-threat-intel:latest
    container_name: isms-core-threat-intel
    profiles: [threat-intel]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATABASE_URL=postgresql://isms_user:${POSTGRES_PASSWORD}@isms-core-postgres:5432/isms_db
      - OPENSEARCH_URL=http://isms-core-opensearch:9200
      - ISMS_API_URL=http://isms-core-backend:8000
      - CONNECTORS_WORKER_SECRET=${CONNECTORS_WORKER_SECRET}
      # Source enable flags
      - TI_MISP_CIRCL_ENABLED=${TI_MISP_CIRCL_ENABLED:-true}
      - TI_MISP_BOTVRIJ_ENABLED=${TI_MISP_BOTVRIJ_ENABLED:-true}
      - TI_ABUSEIPDB_ENABLED=${TI_ABUSEIPDB_ENABLED:-true}
      - TI_URLHAUS_ENABLED=${TI_URLHAUS_ENABLED:-true}
      - TI_THREATFOX_ENABLED=${TI_THREATFOX_ENABLED:-true}
      - TI_SSLBL_ENABLED=${TI_SSLBL_ENABLED:-true}
      - TI_FEODOTRACKER_ENABLED=${TI_FEODOTRACKER_ENABLED:-true}
      - TI_RED_FLAG_DOMAINS_ENABLED=${TI_RED_FLAG_DOMAINS_ENABLED:-true}
      - TI_STOPFORUMSPAM_ENABLED=${TI_STOPFORUMSPAM_ENABLED:-true}
      - TI_MALWAREBAZAAR_ENABLED=${TI_MALWAREBAZAAR_ENABLED:-true}
      - TI_ALIENVAULT_ENABLED=${TI_ALIENVAULT_ENABLED:-true}
      - TI_VIRUSTOTAL_ENABLED=${TI_VIRUSTOTAL_ENABLED:-true}
      - TI_MALPEDIA_ENABLED=${TI_MALPEDIA_ENABLED:-true}
      # API keys (leave empty to disable that source)
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - MALPEDIA_API_KEY=${MALPEDIA_API_KEY:-}
      - THREATFOX_API_KEY=${THREATFOX_API_KEY:-}
      - MALWAREBAZAAR_API_KEY=${MALWAREBAZAAR_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - OTX_IMPORT_DAYS=${OTX_IMPORT_DAYS:-90}
      - VT_API_KEY=${VT_API_KEY:-}
      - VT_DAILY_LIMIT=${VT_DAILY_LIMIT:-450}
      - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - IPINFO_API_KEY=${IPINFO_API_KEY:-}
      # MISP history depth — first run only (2000-01-01 for full archive)
      - TI_MISP_IMPORT_FROM_DATE=${TI_MISP_IMPORT_FROM_DATE:-2024-01-01}
      - TI_RUN_ON_START=${TI_RUN_ON_START:-false}
    volumes:
      - ti-data:/data/ti   # persistent store for MMDB files + future TI downloads
    expose:
      - "9002"          # on-demand trigger server (backend → TI container)
    depends_on:
      isms-core-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isms-core-network

  # ── Email options (optional profiles) ─────────────────────────────────────

  isms-core-mailpit:
    image: axllent/mailpit:latest
    container_name: isms-core-mailpit
    profiles: [mailpit]
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:8025:8025"
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - MP_MAX_MESSAGES=500
    restart: unless-stopped
    networks:
      - isms-core-network

  isms-core-smtp-bridge:
    build:
      context: ./smtp-bridge
    image: isms-core-smtp-bridge:latest
    container_name: isms-core-smtp-bridge
    profiles: [smtp-bridge]
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - TENANT_ID=${SMTP_BRIDGE_TENANT_ID:-}
      - CLIENT_ID=${SMTP_BRIDGE_CLIENT_ID:-}
      - CLIENT_SECRET=${SMTP_BRIDGE_CLIENT_SECRET:-}
      - FROM_ADDRESS=${SMTP_BRIDGE_FROM_ADDRESS:-}
      - FROM_NAME=${SMTP_BRIDGE_FROM_NAME:-ISMS CORE}
      - SMTP_PORT=1025
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - isms-core-network

networks:
  isms-core-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  # OpenSearch: single-node (default)
  opensearch-data:
    driver: local
  # OpenSearch: 3-node cluster (--profile opensearch-cluster)
  osdata01:
    driver: local
  osdata02:
    driver: local
  osdata03:
    driver: local
  # Garage S3 (--profile garage)
  garage-meta:
    driver: local
  garage-data:
    driver: local
  certbot-www:
    driver: local
  # Threat-intel persistent data: GeoLite2 MMDB files, feed CSVs/JSONs
  ti-data:
    driver: local
