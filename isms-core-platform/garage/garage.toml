# Garage S3 — single-node config for ISMS CORE v2 workshop
# Full docs: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
#
# Both rpc_secret AND admin_token are set via env vars (GARAGE_RPC_SECRET,
# GARAGE_ADMIN_TOKEN — see docker-compose.yml's isms-core-garage service),
# confirmed against Garage's own docs: "the following environment variables
# can be used to override the corresponding values in the configuration
# file: GARAGE_RPC_SECRET ... GARAGE_ADMIN_TOKEN" (supported since v0.8.2).
# Deliberately NOT set in this file at all — this file is a template that
# gets overwritten on every redeploy/resync; a real secret placed here would
# get reset back to a placeholder the next time that happens (it did, once,
# during this project's own testing). The real values live only in .env,
# which is never templated over. To rotate: change GARAGE_ADMIN_TOKEN in
# .env, then restart isms-core-garage — nothing to change here.

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

# Single-node: no replication. Increase to 2 or 3 for multi-node setups.
replication_factor = 1

rpc_bind_addr   = "0.0.0.0:3901"
rpc_public_addr = "isms-core-garage:3901"

# Plain HTTP on purpose: Garage cannot terminate TLS (its reference manual: "This endpoint does not support TLS: a reverse proxy should be used to
# provide it"). The platform therefore keeps Garage on a private network (isms-core-garage-network) that only the TLS proxy isms-core-garage-tls
# can reach, and every client talks HTTPS to that proxy (see garage/tls-proxy.conf).
[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region     = "garage"

[admin]
api_bind_addr = "0.0.0.0:3903"
# admin_token intentionally absent — set via GARAGE_ADMIN_TOKEN env var, see comment above
