# TLS in front of Garage.
#
# Garage's S3 API and admin API cannot do TLS themselves ("This endpoint does not support TLS: a reverse proxy should be used to provide it" —
# Garage reference manual, [s3_api] api_bind_addr). This nginx terminates TLS on the same two ports and forwards the decrypted bytes to Garage over
# the private isms-core-garage-network, which only this proxy and Garage are attached to. It works at the TCP level (stream), so nothing about the
# S3 request changes on the way — Host header, signature, chunking and large uploads reach Garage exactly as the client sent them.
#
# The certificate is made by isms-core-internal-certs-init (/certs/garage). Clients must trust it: the OpenSearch nodes through the trust store that
# init builds (/certs/garage/truststore.p12), the setup job through /certs/garage/server.crt.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's embedded DNS, asked again every 10 s, so a restarted Garage (new address) is found without restarting this proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format tls '$remote_addr $ssl_protocol $ssl_cipher status=$status in=$bytes_received out=$bytes_sent t=$session_time';
    # The container's own healthcheck connects from 127.0.0.1 without a TLS handshake every 10 s, which would log a "status=500" line each time and bury
    # real failures. Probes from the container itself are not logged; every other client (including failed handshakes) is.
    map $remote_addr $log_connection {
        127.0.0.1 0;
        default   1;
    }
    access_log /dev/stdout tls if=$log_connection;

    ssl_certificate     /certs/garage/server.crt;
    ssl_certificate_key /certs/garage/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_timeout       1h;                     # idle time on an established connection (a large snapshot part can take a while)

    # S3 API
    server {
        listen 3900 ssl;
        set $garage_s3 isms-core-garage:3900;
        proxy_pass $garage_s3;
    }

    # Admin API (carries the admin token)
    server {
        listen 3903 ssl;
        set $garage_admin isms-core-garage:3903;
        proxy_pass $garage_admin;
    }
}
