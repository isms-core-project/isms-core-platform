  "nFADP (revDSG)":               "UK GDPR / DPA 2018"
  "nFADP (nDSG)":                 "UK GDPR / DPA 2018"
  "nFADP (Swiss revDSG)":         "UK GDPR / DPA 2018"
  "Swiss nFADP":                  "UK GDPR / DPA 2018"
  "Swiss nDSG":                   "UK GDPR / DPA 2018"
  "Swiss Data Protection Ordinance (DSV)": "UK GDPR / DPA 2018"
  "Swiss DSV":                    "UK GDPR / DPA 2018"
  "Data Protection Ordinance (DSV)": "UK GDPR / DPA 2018"
  "Annex 1 DSV":                  "ICO adequacy list"
  "Annex 1, DSV":                 "ICO adequacy list"
  "DSV Annex 1":                  "ICO adequacy list"
  nLPD:                           "UK GDPR / DPA 2018"
  nFADP:                          "UK GDPR / DPA 2018"
  nDSG:                           "UK GDPR / DPA 2018"
  revDSG:                         "UK GDPR / DPA 2018"
  DSV:                            "UK GDPR / DPA 2018"
  "Federal Act on Data Protection": "UK General Data Protection Regulation (UK GDPR) and Data Protection Act 2018"
  "new Federal Act on Data Protection": "UK GDPR and Data Protection Act 2018"
  DSGVO:                          "UK GDPR"
  RGPD:                           "UK GDPR"

