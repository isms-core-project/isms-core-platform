  # Swiss employment law — no UK direct equivalent; map to UK ERA 1996
  "Swiss Code of Obligations":    "UK Employment Rights Act 1996"
  "Code of Obligations":          "Employment Rights Act 1996"
  "Swiss CO":                     "UK ERA 1996"
  "Swiss OR":                     "UK ERA 1996"
  "British OR":                   "UK ERA 1996"
  "Swiss FADP":                   "UK GDPR / DPA 2018"

  # Swiss government body
  "Swiss Federal Council":        "UK Secretary of State"
  "British Federal Council":      "UK Secretary of State"

