  EDÖB:                           "ICO"

  # Financial regulator
  FINMA:                          "FCA / PRA"
  "Swiss Financial Market Supervisory Authority": "Financial Conduct Authority (FCA) / Prudential Regulation Authority (PRA)"

  # Central bank
  BNS:                            "Bank of England"
  "Swiss National Bank":          "Bank of England"
  SNB:                            "Bank of England"

  # National cyber law
  ISG:                            "Cyber Security and Resilience Bill (2025–2026)"
  "Federal Act on Information Security": "Cyber Security and Resilience (Network and Information Systems) Bill (2025–2026)"

  # Currency
  CHF:                            "GBP"
  "Swiss francs":                 "pounds sterling"
  "Swiss franc":                  "pound sterling"

  # EU-specific regulations replaced with UK equivalents
  "DORA (EU 2022/2554)":          "FCA PS21/3 / PRA SS1/21 (UK Operational Resilience)"
  "DORA (if EU financial services entity)": "FCA/PRA Operational Resilience (if UK-regulated financial entity)"
  DORA:                           "FCA/PRA Operational Resilience (PS21/3)"
  "NIS2 (EU 2022/2555)":          "UK NIS Regulations 2018 (SI 2018/506)"
  NIS2:                           "UK NIS Regulations 2018 (SI 2018/506)"
  "EU AI Act":                    "UK AI Regulation (DSIT voluntary framework)"
  "AI Act":                       "UK AI Regulation (DSIT)"
